version: 2

updates:
  - package-ecosystem: npm
    directory: /src
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    # Major continua sendo proposta: o cooldown so segura a release recem-saida,
    # em vez de criar ponto cego na atualizacao de dependencia.
    cooldown:
      default-days: 7
    groups:
      npm-minor-e-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - '*'

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Aqui o bloqueio de major faz sentido: o que se quer e a LTS, nao a versao
    # mais nova, e o Dependabot nao sabe expressar isso (ex.: node:25, ja EOL).
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
