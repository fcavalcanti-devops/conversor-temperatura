version: 2

updates:
  - package-ecosystem: npm
    directory: /src
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Major e decisao manual, nao PR automatico. O ignore nao distingue
    # dependencia de producao de dev, entao a regra vale para todas.
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    groups:
      npm-minor-e-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - '*'

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Evita proposta de major da base, que traz linha nao-LTS (ex.: node:25).
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
