name: 'Release'

on:
  push:
    branches:
      - main
      - homolog
    tags:
      - 'v*'
    paths-ignore:
      - '**.md'
      - '.k8s/**'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: felipecs8/conversor-temperatura

jobs:
  test:
    name: 'Testes'
    uses: ./.github/workflows/test.yaml
    permissions:
      contents: read
      pull-requests: read

  publish:
    name: 'Build e push da imagem'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ startsWith(github.ref, 'refs/tags/v') && 'production' || 'homolog' }}

    permissions:
      contents: read

    env:
      CANDIDATE_IMAGE: conversor-temperatura:candidate-${{ github.sha }}

    steps:
      - name: Check Out Repo
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Sempre: tag imutavel = git sha (igual github.sha)
      # main    -> latest + <sha>
      # homolog -> homolog + <sha>
      # v1.2.3  -> 1.2.3, 1.2 (+ sha do commit da tag)
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=,format=long
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=homolog,enable=${{ github.ref == format('refs/heads/{0}', 'homolog') }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          flavor: |
            latest=false

      # Nada vai para o Docker Hub antes de passar no smoke e no Trivy.
      - name: Build candidate image (amd64)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: ${{ env.CANDIDATE_IMAGE }}
          cache-from: type=gha

      - name: Smoke test
        shell: bash
        run: bash scripts/smoke.sh "$CANDIDATE_IMAGE"

      - name: Remove smoke container
        if: always()
        run: docker rm -f smoke

      - name: Scan image (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.CANDIDATE_IMAGE }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '0'

      - name: Fail on critical vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.CANDIDATE_IMAGE }}
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          skip-setup-trivy: true

      - name: Build and push (multi-arch)
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Job summary
        run: |
          {
            echo '### Imagem publicada'
            echo ''
            echo "Digest: \`${{ steps.build.outputs.digest }}\`"
            echo ''
            echo "Tag imutavel (git sha): \`${{ env.IMAGE_NAME }}:${{ github.sha }}\`"
            echo ''
            echo 'Tags:'
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo ''
          } >> "$GITHUB_STEP_SUMMARY"

  update-helm:
    name: 'Atualizar Helm'
    needs: publish
    runs-on: ubuntu-latest
    # Deploy real → barra na UI; tag v* = production, branch = homolog
    environment: ${{ startsWith(github.ref, 'refs/tags/v') && 'production' || 'homolog' }}
    steps:
      - uses: actions/checkout@v7
        with:
          repository: fcavalcanti-devops/helm-charts
          token: ${{ secrets.HELM_CHARTS_TOKEN }}
      - run: |
          TAG="${{ github.sha }}"
          [[ "${{ github.ref }}" == refs/tags/v* ]] && TAG="${GITHUB_REF_NAME#v}"
          sed -i "s/tag:.*/tag: ${TAG}/" charts/conversor-temperatura/values.yaml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -am "chore: update conversor-temperatura to ${TAG}" || exit 0
          git push

  cleanup-hub:
    name: 'Cleanup Docker Hub'
    needs: publish
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - name: Remover tags sha antigas
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          KEEP: '10'
        run: bash scripts/cleanup-dockerhub.sh
