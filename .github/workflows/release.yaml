name: 'Release'

on:
  push:
    branches:
      - main
      - homolog
    tags:
      - 'v*'
    paths-ignore:
      - '**.md'
      - '.k8s/**'

permissions:
  contents: read

# Nao cancela uma publicacao em andamento.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: felipecs8/conversor-temperatura

jobs:
  test:
    name: 'Testes'
    uses: ./.github/workflows/test.yaml
    permissions:
      contents: read
      pull-requests: read

  publish:
    name: 'Build e push da imagem'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read
      security-events: write

    steps:
      - name: Check Out Repo
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # main    -> latest, main
      # homolog -> homolog
      # v1.2.3  -> 1.2.3, 1.2, latest
      # Deploy imutavel: usar digest (@sha256:...) do job summary, nao tags sha-*.
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
          flavor: |
            latest=auto

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke published image
        env:
          SMOKE_IMAGE: ${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
        run: |
          docker pull "$SMOKE_IMAGE"
          bash scripts/smoke.sh "$SMOKE_IMAGE"

      - name: Remove smoke container
        if: always()
        run: docker rm -f smoke

      - name: Scan published image (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Upload scan results
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
          category: trivy-image

      - name: Job summary
        run: |
          {
            echo '### Imagem publicada'
            echo ''
            echo "Digest: \`${{ steps.build.outputs.digest }}\`"
            echo ''
            echo 'Tags:'
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
