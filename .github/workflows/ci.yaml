name: 'CI'

on:
  pull_request:
    branches:
      - main
      - homolog

permissions:
  contents: read
  pull-requests: read

# PR novo cancela a execucao anterior do mesmo PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 'Testes'
    uses: ./.github/workflows/test.yaml
    permissions:
      contents: read
      pull-requests: read

  build:
    name: 'Build da imagem'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      LOCAL_IMAGE: conversor-temperatura:ci-${{ github.sha }}

    steps:
      - name: Check Out Repo
        uses: actions/checkout@v7

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Sem push: PR ainda nao aprovado nao publica imagem, e nao precisa de secrets
      # (funciona tambem em PR vindo de fork).
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: ${{ env.LOCAL_IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Sobe a imagem e exercita runtime: /health (up) + API + view + user nao-root.
      # Pega quebra que so aparece no container (ex.: dep de fora do npm ci --omit=dev).
      - name: Smoke test
        shell: bash
        run: bash scripts/smoke.sh "$LOCAL_IMAGE"

      - name: Remove container
        if: always()
        run: docker rm -f smoke

      # Relatorio completo no log, sem bloquear.
      - name: Scan image (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.LOCAL_IMAGE }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '0'

      # Bloqueia o PR apenas em vulnerabilidade critica com correcao disponivel.
      - name: Fail on critical vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.LOCAL_IMAGE }}
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          skip-setup-trivy: true
