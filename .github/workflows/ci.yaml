name: 'CI'

on:
  pull_request:
    branches:
      - main
      - homolog

permissions:
  contents: read

# PR novo cancela a execucao anterior do mesmo PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 'Testes'
    uses: ./.github/workflows/test.yaml

  build:
    name: 'Build da imagem'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      LOCAL_IMAGE: conversor-temperatura:ci-${{ github.sha }}

    steps:
      - name: Check Out Repo
        uses: actions/checkout@v7

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Sem push: PR ainda nao aprovado nao publica imagem, e nao precisa de secrets
      # (funciona tambem em PR vindo de fork).
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: ${{ env.LOCAL_IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Sobe a imagem e exercita as rotas. Pega quebra que so aparece em runtime,
      # como um pacote que ficou de fora do npm ci --omit=dev.
      - name: Smoke test
        shell: bash
        run: |
          docker run -d --name smoke -p 8080:8080 "$LOCAL_IMAGE"

          for _ in $(seq 1 20); do
            if curl -fsS http://localhost:8080/health >/dev/null 2>&1; then
              pronto=1
              break
            fi
            sleep 1
          done

          if [ "${pronto:-0}" != 1 ]; then
            echo "A aplicacao nao respondeu em /health"
            exit 1
          fi

          # Os require e o YAML.load acontecem na inicializacao, entao dependencia
          # faltando ja derruba o /health acima. A view so e lida na renderizacao.
          curl -fsS http://localhost:8080/ | grep -q 'Conversor de Temperatura'

          if [ "$(docker exec smoke id -u)" = 0 ]; then
            echo "O container esta rodando como root"
            exit 1
          fi

      - name: Container logs
        if: failure()
        run: docker logs smoke

      - name: Remove container
        if: always()
        run: docker rm -f smoke

      # Relatorio completo no log, sem bloquear.
      - name: Scan image (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.LOCAL_IMAGE }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '0'

      # Bloqueia o PR apenas em vulnerabilidade critica com correcao disponivel.
      - name: Fail on critical vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.LOCAL_IMAGE }}
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          skip-setup-trivy: true
