name: 'CodeQL'

on:
  pull_request:
    branches:
      - main
      - homolog
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: 'CodeQL (${{ matrix.language }})'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        # actions = analisa os proprios workflows (injection, permissoes, etc.)
        language: [javascript-typescript, actions]

    steps:
      - name: Check Out Repo
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
          # Actions referenciadas por tag (@v7) e nao por SHA: decisao consciente.
          config: |
            query-filters:
              - exclude:
                  id: actions/unpinned-tag

      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: '/language:${{ matrix.language }}'
