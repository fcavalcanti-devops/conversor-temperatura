
name: 'Tests'

on:
  workflow_call:

permissions:
  contents: read

jobs:
  unit:
    name: 'Testes (Node ${{ matrix.node }})'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        node: [18, 22]

    defaults:
      run:
        working-directory: src
        shell: bash

    steps:
      - name: Check Out Repo
        uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: src/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npx vitest run --reporter=default --reporter=junit --outputFile.junit=test-results/junit.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-node-${{ matrix.node }}
          path: src/test-results/junit.xml
          if-no-files-found: warn
          retention-days: 7

  audit:
    name: 'Auditoria de dependencias'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: src
        shell: bash

    steps:
      - name: Check Out Repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/package-lock.json

      # Informativo: reporta vulnerabilidades sem bloquear a esteira.
      - name: npm audit
        continue-on-error: true
        run: npm audit --audit-level=high
